spring.application.name=visualmerge
server.port=8080
spring.jackson.default-property-inclusion=non_null

visualmerge.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
# Where the browser is sent after a successful GitHub authorization.
visualmerge.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Real repository support (Phase 1) -------------------------------------
# Cloned repositories live under this root, never inside the application source.
# Defaults to a VisualMerge-owned folder in the system temp directory.
visualmerge.workspace.root=${java.io.tmpdir}/visualmerge-workspaces
visualmerge.workspace.clone-timeout-seconds=120
visualmerge.workspace.max-repository-size-mb=500
visualmerge.workspace.session-ttl-minutes=120
visualmerge.workspace.cleanup-on-shutdown=true

# --- GitHub REST API --------------------------------------------------------
visualmerge.github.api-url=https://api.github.com
visualmerge.github.timeout-seconds=15
# Upper bound on how many repositories are pulled for one user (page size 100).
visualmerge.github.max-repository-pages=5

# --- Database (Aiven MySQL) -------------------------------------------------
# Credentials come from the environment (see backend/.env, which is git-ignored).
# The individual DB_* variables are supported so deployments can supply parts
# instead of a whole URL; AIVEN_DB_URL still wins when it is set.
spring.datasource.url=${AIVEN_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visualmerge}}
spring.datasource.username=${AIVEN_DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${AIVEN_DB_PASSWORD:${DB_PASSWORD:password}}

# Aiven requires TLS. The MySQL connector negotiates it by default; this makes
# the requirement explicit so a driver default change cannot silently downgrade.
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# --- JPA / Hibernate --------------------------------------------------------
# Flyway owns the schema. Hibernate only validates that the entities match it,
# so a mapping mistake fails at startup instead of silently altering Aiven.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The Aiven database already carries Hibernate-created tables from before
# migrations existed, so the first run is baselined instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Security (GitHub OAuth2) ----------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# "repo" is what lets VisualMerge list private repositories and read their
# branches. GitHub OAuth Apps have no read-only variant of it, so this grant is
# broader than what VisualMerge actually does, which is read.
# Set GITHUB_SCOPES=read:user,user:email to limit VisualMerge to public
# repositories; the private filter then simply finds nothing.
spring.security.oauth2.client.registration.github.scope=${GITHUB_SCOPES:read:user,user:email,repo}
